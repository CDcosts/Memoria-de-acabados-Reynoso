<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Memoria de Acabados · Casa Reynoso</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%231D4E6E'/><rect x='3' y='4' width='10' height='1.6' fill='%23FFFDF7'/><rect x='3' y='7.2' width='10' height='1.6' fill='%23FFFDF7'/><rect x='3' y='10.4' width='6' height='1.6' fill='%23FFFDF7'/></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Memoria de Acabados — Cabo Development */
:root{
  color-scheme: light;
  --bg:#F5F1E6; --surface:#FFFDF7; --ink:#1C2A35; --muted:#6B7684; --line:#E2DACA;
  --accent:#1D4E6E; --accent-ink:#FFFDF7; --soft:#ECE4D2;
  --ok:#1A6E4A; --ok-bg:#DDEFE2; --warn:#8A5A00; --warn-bg:#F6E7C4; --q:#A33A2A; --q-bg:#F6DED6;
  --font-head:'IBM Plex Sans Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---- acceso ---- */
.acceso{max-width:420px;margin:8vh auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.acceso h1{font-family:var(--font-head);font-size:24px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.acceso p{margin:0;color:var(--muted)}
.acceso input{padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);width:100%}

/* ---- encabezado ---- */
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.top h1{font-family:var(--font-head);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px;align-items:center}
.meta b{color:var(--ink);font-weight:600}
.hin{box-sizing:content-box;font:inherit;font-weight:600;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:3px;padding:1px 4px;max-width:100%}
.hin:hover:not(:disabled){border-color:var(--line)}
.hin:focus{border-color:var(--accent);background:var(--surface)}
.quien{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.rol{font-family:var(--font-mono);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  border:1px solid var(--accent);color:var(--accent);border-radius:99px;padding:2px 9px}
.rol.prov{border-color:var(--warn);color:var(--warn)}

/* ---- avance ---- */
.progress{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 24px;align-items:end}
.stats{display:flex;flex-wrap:wrap;gap:6px 28px}
.stat{display:flex;flex-direction:column}
.stat .n{font-family:var(--font-head);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat.ok .n{color:var(--ok)} .stat.q .n{color:var(--q)}
.bar{grid-column:1/-1;height:8px;background:var(--soft);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.pct{font-family:var(--font-mono);font-size:13px;color:var(--muted)}

/* ---- herramientas ---- */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.search{flex:1 1 180px;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.btn.danger{color:var(--q);border-color:var(--q)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spacer{flex:1}

/* ---- tabla ---- */
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:1020px}
th{font-family:var(--font-head);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap;background:var(--surface);vertical-align:top}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;min-width:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--soft)}
tbody tr.is-listo td{background:var(--ok-bg);color:#16432F}
tbody tr.is-listo:hover td{background:#CFE8D8}
tbody tr.is-listo td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.pre{white-space:pre-line;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:12px}
.thumb{width:92px;height:92px;object-fit:cover;border-radius:4px;border:1px solid var(--line);display:block;background:var(--soft);cursor:zoom-in}
.noimg{width:92px;height:92px;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:transparent}
.pill.listo{color:var(--ok);background:var(--ok-bg);border-color:var(--ok)}
.pill.borrador{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.flag{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:var(--q);background:var(--q-bg);border-radius:3px;padding:1px 6px}
.prov{display:inline-block;font-weight:600;color:var(--accent);overflow-wrap:anywhere}
.prov.falta{color:var(--warn);font-weight:500;font-style:italic}
tbody tr.is-listo .prov{color:#15603F}
.thprov{min-width:170px}
.thprov>span{display:block;margin-bottom:5px}
.selth{display:block;width:100%;max-width:200px;font-family:var(--font-body);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.selth.activo{border-color:var(--accent);color:var(--accent);font-weight:600;background:var(--soft)}
.cot{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.cot b{font-size:13px}
.cot.sin{color:var(--muted);font-style:italic;font-family:var(--font-body)}
.nc{display:inline-block;min-width:18px;text-align:center;font-size:11px;font-weight:600;background:var(--soft);color:var(--muted);border-radius:99px;padding:1px 7px}
.nc.hay{background:var(--accent);color:var(--accent-ink)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--font-head);font-size:18px;margin-bottom:4px}

/* ---- cajón ---- */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.dh{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px max(16px,env(safe-area-inset-right,0px)) 12px 20px;padding-top:max(14px,env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-family:var(--font-head);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.db{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.df{display:flex;flex-wrap:wrap;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) 20px;border-top:1px solid var(--line);background:var(--surface)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.f input,.f textarea,.f select{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:8px 10px;min-width:0;width:100%}
.f textarea{resize:vertical;min-height:58px}
.f input:disabled,.f textarea:disabled{opacity:.75;background:var(--soft)}
.f.hi>span{color:var(--accent)}
.f.hi input{border:2px solid var(--accent);font-weight:600}
.imgs{display:flex;flex-wrap:wrap;gap:12px}
.slot{display:flex;flex-direction:column;gap:6px;width:150px}
.slot img{width:150px;height:150px;object-fit:contain;background:var(--soft);border:1px solid var(--line);border-radius:4px;cursor:zoom-in}
.slot .ph{width:150px;height:150px;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.slot small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.slot .row{display:flex;gap:6px;flex-wrap:wrap}
.slot .row button{font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--surface);border-radius:3px}
.note{border-radius:4px;padding:10px 12px;font-size:13px}
.note.q{background:var(--q-bg);color:var(--q)}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.info{background:var(--soft);color:var(--muted)}
.secc{border-top:1px solid var(--line);padding-top:12px}
.secc>h3{font-family:var(--font-head);font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px}

/* ---- bitácora ---- */
.bitacora{display:flex;flex-direction:column;gap:10px}
.msg{border-left:3px solid var(--accent);background:var(--bg);border-radius:0 4px 4px 0;padding:8px 12px}
.msg.sys{border-left-color:var(--line)}
.msg .cab{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;font-size:11px;color:var(--muted);margin-bottom:3px}
.msg .cab b{color:var(--ink);font-size:12px}
.msg .cab .r{font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.msg p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.msg.sys p{color:var(--muted);font-size:12.5px}
.dia{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.dia+.dia{margin-top:8px}
.dia>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;
  font-family:var(--font-head);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}
.dia>summary::-webkit-details-marker{display:none}
.dia>summary::before{content:"\25B8";color:var(--accent);font-size:11px;transition:transform .15s;display:inline-block}
.dia[open]>summary::before{transform:rotate(90deg)}
.dia>summary:hover{background:var(--soft)}
.dia>summary .d{flex:1}
.dia>summary .r{font-family:var(--font-body);font-size:11px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.diaCuerpo{display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px}
@media (prefers-reduced-motion: reduce){.dia>summary::before{transition:none}}
.nuevo{display:flex;gap:8px;align-items:flex-end}
.nuevo textarea{flex:1;min-height:42px}

/* ---- importar ---- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,15,13,.5);display:grid;place-items:center;padding:16px}
.caja{background:var(--surface);border-radius:6px;border:1px solid var(--line);max-width:680px;width:100%;max-height:86vh;overflow-y:auto;padding:20px}
.caja h2{font-family:var(--font-head);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;font-size:19px}
.drop{border:2px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--muted);margin:14px 0}
.drop.on{border-color:var(--accent);background:var(--soft)}
.prev{font-size:13px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
.prev table{min-width:0}
.prev td,.prev th{padding:5px 8px;font-size:12px}
.tag{font-size:11px;font-weight:600;border-radius:3px;padding:1px 6px}
.tag.nuevo{background:var(--ok-bg);color:var(--ok)}
.tag.cambia{background:var(--warn-bg);color:var(--warn)}
.tag.igual{background:var(--soft);color:var(--muted)}

.zoom{position:fixed;inset:0;z-index:40;background:rgba(10,15,13,.85);display:grid;place-items:center;padding:20px;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;background:#fff;border-radius:4px}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;z-index:50;font-size:13px;max-width:90vw;text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.pie{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;
  border-top:1px solid var(--line);padding-top:16px;margin-top:4px}
.pie b{font-family:var(--font-head);font-size:13px;text-transform:uppercase;letter-spacing:.07em}
.pie p{margin:4px 0 0;max-width:62ch}
.secBadge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--accent);background:var(--soft);border-radius:3px;padding:1px 6px;margin-bottom:4px}

</style>
</head>
<body>

<!-- ACCESO -->
<section class="acceso" id="acceso" hidden></section>

<!-- TABLERO -->
<div class="wrap" id="app" hidden>

    </div>
    <button class="btn" id="backup" type="button">Hacer back up</button>
  </footer>
</div>

<div id="overlay"></div>

  if (!v) return null;
  if (/^https?:|^data:/.test(v)) return v;

/* ===================== QUIÉN ERES ===================== */
var LLAVE = 'memoria-acabados-quien';

function leerFirma() {
  try {
    var v = JSON.parse(localStorage.getItem(LLAVE) || 'null');
    if (v && v.nombre) { S.nombre = v.nombre; S.depto = v.depto || ''; return true; }
  } catch (e) {}
  return false;
}
function guardarFirma() {
  try { localStorage.setItem(LLAVE, JSON.stringify({ nombre: S.nombre, depto: S.depto })); } catch (e) {}
}

function pedirFirma(cambiar) {
  $('app').hidden = true; $('cargando').hidden = true;
  var a = $('acceso'); a.hidden = false;
  a.innerHTML = '<h1>Memoria de acabados</h1>'
    + '<p>' + (cambiar ? 'Cambia quién está capturando.' : 'Antes de entrar, dinos quién eres. Tu nombre queda firmado en cada cambio y comentario que hagas.') + '</p>'
    + '<label class="f"><span>Nombre</span><input id="fNombre" autocomplete="name" placeholder="Tu nombre" value="' + esc(S.nombre) + '"></label>'
    + '<label class="f"><span>Departamento</span><select id="fDepto">'
    + '<option value="">Elige…</option>'
    + DEPTOS.map(function (d) { return '<option' + (S.depto === d ? ' selected' : '') + '>' + d + '</option>'; }).join('')
    + '</select></label>'
    + '<button class="btn primary" id="fEntrar" type="button">Entrar</button>'
    + '<p class="sub" id="fNota" hidden></p>';
  var sel = $('fDepto');
  $('fEntrar').onclick = function () {
    var n = $('fNombre').value.trim();
    var d = sel.value;
    if (n.length < 2) { aviso('Escribe tu nombre'); return; }
    if (!d) { aviso('Elige tu departamento'); return; }
    S.nombre = n; S.depto = d; guardarFirma();
    a.hidden = true; $('app').hidden = false;
    if (!S.cargado) { cargar(); vivo(); } else render();
  };
  $('fNombre').onkeydown = function (e) { if (e.key === 'Enter') $('fEntrar').click(); };
  function aviso(t) { var n = $('fNota'); n.hidden = false; n.textContent = t; }
}

function arranque() {
  if (!leerFirma()) { pedirFirma(false); return; }
  $('cargando').hidden = true; $('acceso').hidden = true; $('app').hidden = false;
  cargar(); vivo();
}

/* ===================== DATOS ===================== */
async function cargar() {
  var p = await sb.from('proyecto').select('*').eq('id', 'actual').maybeSingle();
  if (p.data) S.cfg = p.data;

  var a = await sb.from('acabados').select('*').order('hoja').order('orden');
  if (a.error) { toast('No se pudieron leer los acabados: ' + a.error.message); return; }
  S.items = a.data || [];

  var n = await sb.from('comentarios').select('acabado_id');
  S.nComent = {};
  (n.data || []).forEach(function (x) { S.nComent[x.acabado_id] = (S.nComent[x.acabado_id] || 0) + 1; });

  S.cargado = true;
  render();
}

function vivo() {
  sb.channel('memoria')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'acabados' }, function () { cargar(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comentarios' }, function () {
      cargar(); if (S.edit) verBitacora(S.edit.id);
    })
    .subscribe();
}

/* ===================== RENDER ===================== */
function filas() {
  var q = S.q.trim().toLowerCase();
  return S.items.filter(function (it) {
    if (S.filtro === 'listos' && it.estado !== 'listo') return false;
    if (S.filtro === 'pendientes' && it.estado === 'listo') return false;
    if (S.prov) {
      var pv = String(it.proveedor || '').trim().toLowerCase();
      if (S.prov === '__sin__') { if (pv) return false; } else if (pv !== S.prov) return false;
    }
    if (q) {
      var h = [it.localizacion, it.material, it.naturaleza, it.acabado, it.formato, it.proveedor, it.origen, it.observaciones].join(' ').toLowerCase();
      if (h.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function (a, b) {
    var ha = a.hoja === 'memoria' ? 0 : 1, hb = b.hoja === 'memoria' ? 0 : 1;
    return ha !== hb ? ha - hb : (a.orden || 0) - (b.orden || 0);
  });
}

function renderHead() {
  var c = S.cfg, puede = true;
  if (!(document.activeElement && document.activeElement.closest && document.activeElement.closest('#meta'))) {
    $('meta').innerHTML = [['empresa', ''], ['obra', 'Obra'], ['clave', 'Clave'], ['cliente', 'Cliente']].map(function (p) {
      var v = c[p[0]] == null ? '' : String(c[p[0]]);
      return '<span>' + (p[1] ? p[1] + ' ' : '') + '<input class="hin" data-c="' + p[0] + '" value="' + esc(v) + '" size="' + (v.length + 2) + '"' + (puede ? '' : ' disabled') + '></span>';
    }).join('');
  }
  $('quien').innerHTML = '<span>Captura <b>' + esc(S.nombre) + '</b></span>'
    + '<span class="rol">' + esc(S.depto) + '</span>'
    + '<button class="btn" type="button" id="cambiarYo" style="padding:4px 10px;font-size:12px">No soy yo</button>';
  $('cambiarYo').onclick = function () { pedirFirma(true); };
}

function renderProgress() {
  var all = S.items;
  var t = all.length, l = all.filter(function (i) { return i.estado === 'listo'; }).length;
  var q = all.filter(function (i) { return i.estado !== 'listo' && preguntas(i); }).length;
  var np = all.filter(function (i) { return !String(i.proveedor || '').trim(); }).length;
  var p = t ? Math.round(l / t * 100) : 0;
  $('progress').innerHTML = '<div class="stats">'
    + '<div class="stat"><span class="n">' + t + '</span><span class="l">Renglones</span></div>'
    + '<div class="stat ok"><span class="n">' + l + '</span><span class="l">Listos para cotizar</span></div>'
    + '<div class="stat"><span class="n">' + (t - l) + '</span><span class="l">En borrador</span></div>'
    + '<div class="stat q"><span class="n">' + q + '</span><span class="l">Con preguntas abiertas</span></div>'
    + (true ? '<div class="stat q"><span class="n">' + np + '</span><span class="l">Sin proveedor</span></div>' : '')
    + '</div><div class="pct">' + p + '% listo</div>'
    + '<div class="bar" role="progressbar" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i style="width:' + p + '%"></i></div>';
}

function renderTools() {
  var chips = [['todos', 'Todos'], ['pendientes', 'Borrador'], ['listos', 'Listos']];
  $('chips').innerHTML = chips.map(function (c) {
    return '<button class="chip" type="button" data-f="' + c[0] + '" aria-pressed="' + (S.filtro === c[0]) + '">' + c[1] + '</button>';
  }).join('');
}

function provHtml() {
  var all = S.items;
  var cuenta = {}, etiqueta = {}, sin = 0;
  all.forEach(function (i) {
    var v = String(i.proveedor || '').trim();
    if (!v) { sin++; return; }
    var k = v.toLowerCase(); cuenta[k] = (cuenta[k] || 0) + 1; if (!etiqueta[k]) etiqueta[k] = v;
  });
  var claves = Object.keys(cuenta).sort(function (a, b) { return etiqueta[a].localeCompare(etiqueta[b], 'es'); });
  var h = '<option value="">Todos · ' + all.length + '</option>';
  claves.forEach(function (k) { h += '<option value="' + esc(k) + '"' + (S.prov === k ? ' selected' : '') + '>' + esc(etiqueta[k]) + ' · ' + cuenta[k] + '</option>'; });
  if (sin) h += '<option value="__sin__"' + (S.prov === '__sin__' ? ' selected' : '') + '>Sin proveedor · ' + sin + '</option>';
  S.provEtiqueta = S.prov === '__sin__' ? 'Sin proveedor' : (etiqueta[S.prov] || '');
  return '<select class="selth' + (S.prov ? ' activo' : '') + '" id="prov" aria-label="Filtrar por proveedor">' + h + '</select>';
}

function thumb(it) {
  var u = imgUrl(it.img_ref || it.img_formato || it.img_material);
  return u ? '<img class="thumb" loading="lazy" alt="Referencia" data-zoom="' + esc(u) + '" src="' + esc(u) + '" onerror="this.outerHTML=\'<div class=&quot;noimg&quot;>sin imagen</div>\'">' : '<div class="noimg">sin imagen</div>';
}

function renderTable() {
  var list = filas(), w = $('tablewrap');
  if (!S.cargado) { w.innerHTML = '<div class="empty"><b>Cargando acabados…</b></div>'; return; }
  if (!list.length) {
    var hay = S.items.length > 0;
    w.innerHTML = '<div class="empty"><b>' + (hay ? 'Ningún renglón coincide' : 'Aún no hay acabados en esta hoja') + '</b>'
      + (S.prov || S.filtro !== 'todos' || S.q.trim()
        ? '<div style="margin-top:10px"><button class="btn" type="button" id="limpiar">Quitar filtros</button></div>'

    var lb = $('limpiar');
    if (lb) lb.onclick = function () { S.prov = ''; S.filtro = 'todos'; S.q = ''; $('q').value = ''; render(); };
    return;
  }
  var h = '<table><thead><tr><th>Estado</th><th></th><th>Localización</th><th>Material y acabado</th>'
    + '<th class="thprov"><span>Proveedor / marca</span>' + provHtml() + '</th>'
    + '<th>Formato</th><th>Bitácora</th></tr></thead><tbody>';
  list.forEach(function (it) {
    var l = it.estado === 'listo', nc = S.nComent[it.id] || 0;

      + '<td>' + (true
        ? '<button type="button" class="pill ' + (l ? 'listo' : 'borrador') + '" data-toggle="' + esc(it.id) + '">' + (l ? '✓ Listo para cotizar' : 'Borrador') + '</button>'
        : '<span class="pill ' + (l ? 'listo' : 'borrador') + '">' + (l ? '✓ Listo para cotizar' : 'Borrador') + '</span>')
      + (!l && preguntas(it) ? '<br><span class="flag">Preguntas abiertas</span>' : '') + '</td>'
      + '<td>' + thumb(it) + '</td>'
      + '<td class="pre">' + (it.hoja === 'despieces' ? '<span class="secBadge">Despiece</span><br>' : '') + esc(it.localizacion) + '</td>'
      + '<td class="pre">' + esc(it.material || (it.img_material ? '(ver imagen)' : ''))
      + '<div class="sub">' + esc([it.naturaleza, it.acabado].filter(Boolean).join(' · ')) + '</div></td>'
      + '<td>' + (String(it.proveedor || '').trim()
        ? '<span class="prov">' + esc(it.proveedor) + '</span>'
        : '<span class="prov falta">Falta proveedor</span>') + '</td>'
      + '<td class="pre">' + esc(it.formato || (it.img_formato ? '(ver imagen)' : '')) + '</td>'
      + '<td><span class="nc' + (nc ? ' hay' : '') + '">' + nc + '</span></td></tr>';
  });
  w.innerHTML = h + '</tbody></table>';
  var bp = $('pdf'); if (bp && !bp.disabled) bp.textContent = 'Exportar PDF · ' + list.length;
}

/* ===================== CAJÓN ===================== */
function cerrarCajon() { S.edit = null; $('overlay').innerHTML = ''; }

function abrirCajon(id) {
  var it, nuevo = false;
  if (id === 'new') {
    nuevo = true;
    var mx = 0; S.items.forEach(function (i) { if (i.hoja === 'memoria') mx = Math.max(mx, i.orden || 0); });
    it = { id: 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), hoja: 'memoria', orden: mx + 1, estado: 'borrador' };
  } else {
    it = S.items.filter(function (i) { return i.id === id; })[0];
    if (!it) return;
  }
  S.edit = { id: it.id, nuevo: nuevo, draft: JSON.parse(JSON.stringify(it)) };
  cajon();
  if (!nuevo) { verBitacora(it.id); verHistorial(it.id); }
}

function cajon() {
  var e = S.edit, d = e.draft, puede = true;
  var h = '<div class="scrim" id="scrim"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Ficha del acabado">'
    + '<div class="dh"><h2>' + (e.nuevo ? 'Nuevo acabado' : 'Acabado') + '</h2>'
    + '<div style="display:flex;gap:8px;align-items:center">'
    + '<span class="pill ' + (d.estado === 'listo' ? 'listo' : 'borrador') + '">' + (d.estado === 'listo' ? '✓ Listo para cotizar' : 'Borrador') + '</span>'
    + '<button class="btn" type="button" id="x">Cerrar</button></div></div><div class="db" id="dbody">';

  if (d.estado === 'listo' && d.listo_en) h += '<div class="note ok">Cerrado para cotizar el ' + esc(fdate(d.listo_en)) + '.</div>';

  // imágenes
  h += '<div><div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin-bottom:6px">Imágenes</div><div class="imgs">';
  IMGS.forEach(function (m) {
    var u = imgUrl(d[m[0]]);

    h += '<div class="slot"><small>' + m[1] + '</small>'
      + (u ? '<img data-zoom="' + esc(u) + '" src="' + esc(u) + '" alt="' + m[1] + '" onerror="this.outerHTML=\'<div class=&quot;ph&quot;>Sin imagen</div>\'">' : '<div class="ph">Sin imagen</div>')
      + '<div class="row">' + (puede ? '<button type="button" data-up="' + m[0] + '">' + (u ? 'Cambiar' : 'Subir') + '</button>' : '')
      + (u && puede ? '<button type="button" data-rm="' + m[0] + '">Quitar</button>' : '') + '</div></div>';
  });
  h += '</div></div>';

  // ficha
  h += '<div class="grid2">';
  FIELDS.forEach(function (f) {
    var k = f[0], v = d[k] == null ? '' : d[k], hi = (f[2] === 'hi'), wide = (f[2] === 'area' || hi);

    h += '<label class="f' + (hi ? ' hi' : '') + '" style="' + (wide ? 'grid-column:1/-1' : '') + '"><span>' + f[1] + '</span>' + inp + '</label>';
  });
  h += '<label class="f"><span>Sección</span><select data-k="hoja"' + (puede ? '' : ' disabled') + '>'
    + HOJAS.map(function (x) { return '<option value="' + x[0] + '"' + (d.hoja === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('')
    + '</select></label>';
  h += '</div><datalist id="natlist">' + NAT.map(function (n) { return '<option value="' + n + '">'; }).join('') + '</datalist>';

  if (!e.nuevo) {
    h += '<div class="secc"><h3>Bitácora</h3><div class="bitacora" id="bitacora"><p class="sub">Cargando…</p></div>'

    h += '<span class="spacer"></span>';
  }

  $('overlay').innerHTML = h;
  $('scrim').onclick = cerrarCajon; $('x').onclick = cerrarCajon;
  $('dbody').addEventListener('input', function (ev) {
    var k = ev.target.getAttribute && ev.target.getAttribute('data-k');
    if (k) S.edit.draft[k] = ev.target.value;
  });
  $('dbody').addEventListener('click', clickCajon);
  if ($('guardar')) $('guardar').onclick = function () { guardar(false); };
  if ($('cerrarR')) $('cerrarR').onclick = function () { guardar(true); };
  if ($('reabrir')) $('reabrir').onclick = reabrir;

function clickCajon(ev) {
  var t = ev.target;
  var z = t.getAttribute && t.getAttribute('data-zoom'); if (z) { verZoom(z); return; }
  var up = t.getAttribute && t.getAttribute('data-up'); if (up) { subirImagen(up); return; }
  var rm = t.getAttribute && t.getAttribute('data-rm'); if (rm) { S.edit.draft[rm] = null; conScroll(cajon); return; }
}
function conScroll(fn) { var b = $('dbody'), y = b ? b.scrollTop : 0; fn(); var n = $('dbody'); if (n) n.scrollTop = y; }
function verZoom(u) { var z = document.createElement('div'); z.className = 'zoom'; z.innerHTML = '<img alt="Imagen ampliada" src="' + esc(u) + '">'; z.onclick = function () { z.remove(); }; document.body.appendChild(z); }

async function subirImagen(campo) {
  var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async function () {
    var f = inp.files && inp.files[0]; if (!f) return;
    toast('Subiendo imagen…');
    var ext = (f.name.split('.').pop() || 'png').toLowerCase();
    var ruta = 'subidas/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
    var r = await sb.storage.from('acabados').upload(ruta, f, { upsert: false });
    if (r.error) { toast('No se pudo subir: ' + r.error.message); return; }
    var pub = sb.storage.from('acabados').getPublicUrl(ruta);
    S.edit.draft[campo] = pub.data.publicUrl;
    conScroll(cajon);
    toast('Imagen cargada. Guarda para conservarla.');
  };
  inp.click();
}

/* ---- guardar ficha ---- */
function limpiar(d) {
  var o = {};
  FIELDS.forEach(function (f) { o[f[0]] = String(d[f[0]] == null ? '' : d[f[0]]).trim(); });
  if (d.hoja) o.hoja = d.hoja;
  IMGS.forEach(function (m) { o[m[0]] = d[m[0]] || null; });
  return o;
}
async function guardar(listo) {
  var e = S.edit, d = e.draft, data = limpiar(d);
  var btn = $(listo ? 'cerrarR' : 'guardar'); if (btn) btn.disabled = true;
  data.actualizado_por = firma();
  data.actualizado_en = new Date().toISOString();
  if (listo) { data.estado = 'listo'; data.listo_por = firma(); data.listo_en = new Date().toISOString(); }
  var r;
  if (e.nuevo) {
    data.id = d.id; data.hoja = d.hoja || 'memoria'; data.orden = d.orden;
    data.estado = listo ? 'listo' : 'borrador'; data.creado_por = firma();
    r = await sb.from('acabados').insert(data);
  } else {
    r = await sb.from('acabados').update(data).eq('id', d.id);
  }
  if (r.error) { if (btn) btn.disabled = false; toast('No se pudo guardar: ' + r.error.message); return; }
  toast(listo ? 'Guardado y listo para cotizar' : 'Cambios guardados');
  cerrarCajon(); cargar();
}
async function reabrir() {
  var r = await sb.from('acabados').update({ estado: 'borrador', listo_por: null, listo_en: null, actualizado_por: firma() }).eq('id', S.edit.id);
  if (r.error) { toast('No se pudo reabrir: ' + r.error.message); return; }
  S.edit.draft.estado = 'borrador'; conScroll(cajon); cargar();
}
function pedirBorrar() {
  $('warn').innerHTML = '<div class="note q">Se eliminará este renglón y su bitácora, para todos. '
    + '<button class="btn danger" type="button" id="borrar2" style="margin-left:8px">Sí, eliminar</button></div>';
  $('borrar2').onclick = async function () {
    var r = await sb.from('acabados').delete().eq('id', S.edit.id);
    if (r.error) { toast('No se pudo eliminar: ' + r.error.message); return; }
    toast('Renglón eliminado'); cerrarCajon(); cargar();
  };
}
async function alternarEstado(it) {
  var listo = it.estado !== 'listo';
  var r = await sb.from('acabados').update(listo
    ? { estado: 'listo', listo_por: firma(), listo_en: new Date().toISOString(), actualizado_por: firma() }
    : { estado: 'borrador', listo_por: null, listo_en: null, actualizado_por: firma() }).eq('id', it.id);
  if (r.error) { toast('No se pudo actualizar: ' + r.error.message); return; }

/* ---- bitácora ---- */
async function verBitacora(id) {
  var box = $('bitacora'); if (!box) return;
  var r = await sb.from('comentarios').select('*').eq('acabado_id', id).order('creado_en', { ascending: true });
  if (r.error) { box.innerHTML = '<p class="sub">No se pudo leer la bitácora.</p>'; return; }
  S.bit = r.data || [];
  pintarBitacora();
}
async function verHistorial(id) {
  if (!true) return;
  var r = await sb.from('historial').select('*').eq('acabado_id', id).order('creado_en', { ascending: true });
  S.hist = (r.data || []);
  pintarBitacora();
}
function diaDe(iso) {
  var d = new Date(iso), hoy = new Date();
  var mismo = function (a, b) { return a.toDateString() === b.toDateString(); };
  if (mismo(d, hoy)) return 'Hoy';
  var ayer = new Date(hoy.getTime() - 86400000);
  if (mismo(d, ayer)) return 'Ayer';
  return d.toLocaleDateString('es-MX', { weekday: 'long', day: '2-digit', month: 'long' });
}
function hora(iso) { try { return new Date(iso).toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }

function pintarBitacora() {
  var box = $('bitacora'); if (!box) return;
  var ev = [];
  (S.bit || []).forEach(function (c) { ev.push({ t: c.creado_en, tipo: 'c', d: c }); });
  (S.hist || []).forEach(function (x) { ev.push({ t: x.creado_en, tipo: 'h', d: x }); });
  ev.sort(function (a, b) { return a.t < b.t ? -1 : 1; });
  if (!ev.length) { box.innerHTML = '<p class="sub">Sin movimientos todavía. El primer comentario queda aquí.</p>'; return; }

  // un grupo plegable por día; el más reciente abierto, los anteriores cerrados
  var dias = [], indice = {};
  ev.forEach(function (e) {
    var d = diaDe(e.t);
    if (!(d in indice)) { indice[d] = dias.length; dias.push({ dia: d, lista: [] }); }
    dias[indice[d]].lista.push(e);
  });
  box.innerHTML = dias.map(function (g, n) {
    var ultimo = n === dias.length - 1;
    var coments = g.lista.filter(function (e) { return e.tipo === 'c'; }).length;
    var cambios = g.lista.length - coments;
    var resumen = [coments ? coments + (coments === 1 ? ' comentario' : ' comentarios') : '',
                   cambios ? cambios + (cambios === 1 ? ' cambio' : ' cambios') : ''].filter(Boolean).join(' · ');
    return '<details class="dia"' + (ultimo ? ' open' : '') + '>'
      + '<summary><span class="d">' + esc(g.dia) + '</span><span class="r">' + esc(resumen) + '</span></summary>'
      + '<div class="diaCuerpo">' + g.lista.map(pintarEvento).join('') + '</div></details>';
  }).join('');
}
function pintarEvento(e) {
  return [e].map(function (e) {
    if (e.tipo === 'c') {
      var c = e.d;
      return '<div class="msg"><div class="cab"><b>' + esc(c.autor_nombre || c.autor_email) + '</b>'
        + '<span class="r">' + esc(c.departamento || c.rol || '') + '</span><span>' + esc(hora(c.creado_en)) + '</span></div>'
        + '<p>' + esc(c.texto) + '</p></div>';
    }
    var x = e.d;
    return '<div class="msg sys"><div class="cab"><b>' + esc(x.autor_nombre || x.autor_email || 'sin identificar') + '</b>'
      + '<span>' + esc(hora(x.creado_en)) + '</span></div>'
      + '<p>cambió <b>' + esc(x.campo) + '</b>: ' + esc((x.antes || '—').slice(0, 90)) + ' → ' + esc((x.despues || '—').slice(0, 90)) + '</p></div>';
  }).join('');
}
async function enviarComentario() {
  var ta = $('nuevoComent'), txt = ta.value.trim();
  if (!txt) { toast('Escribe algo primero'); return; }
  $('comentar').disabled = true;
  var r = await sb.from('comentarios').insert({
    acabado_id: S.edit.id, texto: txt,
    autor_email: '', autor_nombre: S.nombre, rol: S.depto, departamento: S.depto
  });
  $('comentar').disabled = false;
  if (r.error) { toast('No se pudo comentar: ' + r.error.message); return; }
  ta.value = '';
  await verBitacora(S.edit.id);
  cargar();
}

/* ===================== IMPORTAR EXCEL ===================== */
function abrirImportar() {
  $('overlay').innerHTML = '<div class="modal" id="mod"><div class="caja">'
    + '<h2>Importar Excel</h2>'
    + '<p class="sub">Toma las hojas <b>Memoria de acabados</b> y <b>Despieces Especiales</b> con el formato de siempre: encabezados en la fila 6, datos desde la fila 7. '
    + 'Compara contra lo que ya hay y te muestra qué entra antes de escribir nada.</p>'
    + '<div class="drop" id="drop">Arrastra el archivo aquí, o <button class="btn" type="button" id="elegir">elígelo</button>'
    + '<input type="file" id="archivo" accept=".xlsx,.xlsm" hidden></div>'
    + '<div id="resumen"></div>'
    + '<div style="display:flex;gap:10px;margin-top:14px"><button class="btn primary" type="button" id="aplicar" disabled>Aplicar cambios</button>'
    + '<button class="btn" type="button" id="cancelar">Cancelar</button></div>'
    + '</div></div>';
  $('cancelar').onclick = function () { $('overlay').innerHTML = ''; };
  $('elegir').onclick = function () { $('archivo').click(); };
  $('archivo').onchange = function () { if (this.files[0]) leerExcel(this.files[0]); };
  var dz = $('drop');
  dz.ondragover = function (e) { e.preventDefault(); dz.classList.add('on'); };
  dz.ondragleave = function () { dz.classList.remove('on'); };
  dz.ondrop = function (e) { e.preventDefault(); dz.classList.remove('on'); if (e.dataTransfer.files[0]) leerExcel(e.dataTransfer.files[0]); };
}

function limpiaCelda(v) {
  if (v == null) return '';
  var s = String(v).trim();
  return s.indexOf('#VALUE') === 0 ? '' : s;
}

function leerExcel(file) {
  var fr = new FileReader();
  fr.onload = function (ev) {
    var wb;
    try { wb = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' }); }
    catch (err) { $('resumen').innerHTML = '<div class="note q">No se pudo leer el archivo: ' + esc(err.message) + '</div>'; return; }
    var plan = [], idx = { memoria: 'm', despieces: 'd' };
    Object.keys(idx).forEach(function (hoja) {
      var nombre = wb.SheetNames.filter(function (n) {
        var x = n.toLowerCase();
        return hoja === 'memoria' ? x.indexOf('memoria') >= 0 : x.indexOf('despiece') >= 0;
      })[0];
      if (!nombre) return;
      var filas = XLSX.utils.sheet_to_json(wb.Sheets[nombre], { header: 'A', range: 6, defval: '' });
      var n = 0;
      filas.forEach(function (f) {
        var loc = limpiaCelda(f.B);
        if (!loc) return;
        n++;
        var id = idx[hoja] + String(n).padStart(2, '0');
        var fila = {
          id: id, hoja: hoja, orden: n,
          localizacion: loc,
          material: limpiaCelda(f.C), naturaleza: limpiaCelda(f.D), acabado: limpiaCelda(f.E),
          formato: limpiaCelda(f.F), proveedor: limpiaCelda(f.H),
          origen: limpiaCelda(f.L), observaciones: limpiaCelda(f.O)
        };
        var actual = S.items.filter(function (x) { return x.id === id; })[0];
        var estado = 'nuevo', cambios = [];
        if (actual) {
          ['localizacion', 'material', 'naturaleza', 'acabado', 'formato', 'proveedor', 'origen', 'observaciones'].forEach(function (c) {
            if (String(actual[c] || '').trim() !== fila[c]) cambios.push(c);
          });
          estado = cambios.length ? 'cambia' : 'igual';
        }
        plan.push({ fila: fila, estado: estado, cambios: cambios, actual: actual });
      });
    });
    pintarPlan(plan);
  };
  fr.readAsArrayBuffer(file);
}

function pintarPlan(plan) {
  var nuevos = plan.filter(function (p) { return p.estado === 'nuevo'; });
  var cambian = plan.filter(function (p) { return p.estado === 'cambia'; });
  var iguales = plan.filter(function (p) { return p.estado === 'igual'; });
  var cerrados = cambian.filter(function (p) { return p.actual && p.actual.estado === 'listo'; });
  var h = '<div class="note info">Encontré <b>' + plan.length + '</b> renglones en el archivo: '
    + '<b>' + nuevos.length + '</b> nuevos, <b>' + cambian.length + '</b> con cambios, <b>' + iguales.length + '</b> sin cambio.</div>';
  if (cerrados.length) h += '<div class="note warn">' + cerrados.length + ' de los que cambian ya estaban marcados como listos para cotizar. Se actualizan y siguen listos; revisa que el cambio no los invalide.</div>';
  if (nuevos.length + cambian.length) {
    h += '<div class="prev"><table><tbody>';
    nuevos.concat(cambian).forEach(function (p) {
      h += '<tr><td><span class="tag ' + p.estado + '">' + (p.estado === 'nuevo' ? 'nuevo' : 'cambia') + '</span></td>'
        + '<td><b>' + esc(p.fila.id) + '</b></td><td>' + esc(p.fila.localizacion.slice(0, 60)) + '</td>'
        + '<td class="sub">' + esc(p.cambios.join(', ')) + '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<p class="sub" style="margin-top:8px">Las imágenes del Excel no se pueden leer desde el navegador; los renglones nuevos entran sin foto y se la pones desde su ficha. '
      + 'No se borra nada: lo que esté en el tablero y no venga en el archivo se queda.</p>';
  }
  $('resumen').innerHTML = h;
  var b = $('aplicar');
  b.disabled = !(nuevos.length + cambian.length);
  b.onclick = function () { aplicarPlan(nuevos.concat(cambian)); };
}

async function aplicarPlan(lista) {
  var b = $('aplicar'); b.disabled = true; b.textContent = 'Aplicando…';
  var ok = 0, err = [];
  for (var i = 0; i < lista.length; i++) {
    var p = lista[i], f = p.fila;
    f.actualizado_por = firma(); f.actualizado_en = new Date().toISOString();
    var r;
    if (p.estado === 'nuevo') { f.creado_por = firma(); r = await sb.from('acabados').insert(f); }
    else { var u = Object.assign({}, f); delete u.id; delete u.hoja; r = await sb.from('acabados').update(u).eq('id', f.id); }
    if (r.error) err.push(f.id + ': ' + r.error.message); else ok++;
  }
  $('overlay').innerHTML = '';
  await cargar();
  toast(err.length ? (ok + ' aplicados, ' + err.length + ' con error') : (ok + ' renglones actualizados desde el Excel'));
  if (err.length) console.warn('Errores al importar:', err);
}

/* ===================== PDF ===================== */
function miniatura(url) {
  return new Promise(function (res) {
    if (!url) { res(null); return; }
    var im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = function () {
      try {
        var w = 160, h = Math.round(im.height * (w / im.width));
        if (h > 160) { h = 160; w = Math.round(im.width * (h / im.height)); }
        var c = document.createElement('canvas'); c.width = w; c.height = h;
        var cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(im, 0, 0, w, h);
        res({ d: c.toDataURL('image/jpeg', 0.72), w: w, h: h });
      } catch (e) { res(null); }
    };
    im.onerror = function () { res(null); };
    im.src = url;
  });
}

async function exportPdf() {
  var JP = window.jspdf && window.jspdf.jsPDF;
  if (!JP) { toast('No se pudo cargar el generador de PDF'); return; }
  var lista = filas();
  if (!lista.length) { toast('No hay renglones que exportar con estos filtros'); return; }
  var titulo = 'Memoria de acabados';
  var btn = $('pdf'); btn.disabled = true; btn.textContent = 'Armando PDF…';
  try {
    var imgs = await Promise.all(lista.map(function (r) { return miniatura(imgUrl(r.img_ref || r.img_material || r.img_formato)); }));
    var mapa = {}; lista.forEach(function (r, n) { mapa[r.id] = imgs[n]; });
    var doc = new JP({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 32, y = M + 6;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.setTextColor(28, 42, 53);
    doc.text('MEMORIA DE ACABADOS', M, y); y += 16;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(107, 118, 132);
    doc.text([S.cfg.empresa, S.cfg.obra ? 'Obra: ' + S.cfg.obra : '', S.cfg.clave ? 'Clave: ' + S.cfg.clave : '', S.cfg.cliente ? 'Cliente: ' + S.cfg.cliente : ''].filter(Boolean).join('   ·   '), M, y); y += 12;
    var f = [];
    if (S.filtro !== 'todos') f.push('filtro: ' + S.filtro);
    if (S.prov) f.push('proveedor: ' + (S.provEtiqueta || S.prov));
    if (S.q.trim()) f.push('búsqueda: “' + S.q.trim() + '”');
    doc.text((f.length ? f.join('   ·   ') + '   ·   ' : '') + 'Generado el ' + new Date().toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric' }), M, y); y += 10;
    doc.setDrawColor(226, 218, 202); doc.line(M, y, W - M, y);

    var cuerpo = lista.map(function (r) {
      return ['', (r.hoja === 'despieces' ? '[Despiece] ' : '') + String(r.localizacion || ''), String(r.material || (r.img_material ? '(ver imagen)' : '')),
        String(r.proveedor || '').trim() || '— falta proveedor —',
        [r.naturaleza, r.acabado].filter(Boolean).join(' · '),
        String(r.formato || (r.img_formato ? '(ver imagen)' : '')),
        r.estado === 'listo' ? 'LISTO' : 'Borrador',
        String(r.observaciones || '')];
    });
    var inicio = y + 22;
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10); doc.setTextColor(29, 78, 110);
    doc.text(titulo.toUpperCase() + '  ·  ' + lista.length + ' renglones', M, inicio - 8);
    doc.autoTable({
      startY: inicio, margin: { left: M, right: M, top: M, bottom: M },
      head: [['Imagen', 'Localización', 'Material y acabado', 'Proveedor / marca', 'Naturaleza · acabado', 'Formato', 'Estado', 'Observaciones']],
      body: cuerpo, theme: 'grid',
      styles: { font: 'helvetica', fontSize: 7.5, cellPadding: 4, overflow: 'linebreak', valign: 'top', lineColor: [226, 218, 202], textColor: [28, 42, 53] },
      headStyles: { fillColor: [29, 78, 110], textColor: [255, 253, 247], fontStyle: 'bold', fontSize: 7.5 },
      alternateRowStyles: { fillColor: [250, 247, 239] },
      columnStyles: { 0: { cellWidth: 56 }, 1: { cellWidth: 112 }, 2: { cellWidth: 130 }, 3: { cellWidth: 92, fontStyle: 'bold', textColor: [29, 78, 110] }, 4: { cellWidth: 88 }, 5: { cellWidth: 88 }, 6: { cellWidth: 46 }, 7: { cellWidth: 'auto' } },
      didParseCell: function (dt) {
        if (dt.section !== 'body') return;
        dt.cell.styles.minCellHeight = 52;
        var r = lista[dt.row.index]; if (!r) return;
        if (dt.column.index === 3 && !String(r.proveedor || '').trim()) { dt.cell.styles.textColor = [138, 90, 0]; dt.cell.styles.fontStyle = 'italic'; }
        if (dt.column.index === 6 && r.estado === 'listo') { dt.cell.styles.textColor = [26, 110, 74]; dt.cell.styles.fontStyle = 'bold'; }
        if (r.estado === 'listo') dt.cell.styles.fillColor = [221, 239, 226];
      },
      didDrawPage: function () {
        doc.setFontSize(7.5); doc.setTextColor(140, 150, 160);
        doc.text(titulo, M, H - 16);
        doc.text('Página ' + doc.internal.getNumberOfPages(), W - M, H - 16, { align: 'right' });
      },
      didDrawCell: function (dt) {
        if (dt.section !== 'body' || dt.column.index !== 0) return;
        var r = lista[dt.row.index]; if (!r) return;
        var im = mapa[r.id]; if (!im) return;
        var lado = 44, w = im.w >= im.h ? lado : Math.round(im.w * (lado / im.h)), hh = im.w >= im.h ? Math.round(im.h * (lado / im.w)) : lado;
        try { doc.addImage(im.d, 'JPEG', dt.cell.x + (dt.cell.width - w) / 2, dt.cell.y + 3, w, hh); } catch (e) {}
      }
    });
    var nom = ('Memoria de acabados ' + (S.cfg.obra || S.cfg.clave || '') + (S.prov ? ' - ' + (S.provEtiqueta || '') : ''))
      .replace(/[^\wáéíóúñÁÉÍÓÚÑ \-]/g, '').trim() + '.pdf';
    doc.save(nom);
    toast('PDF listo');
  } catch (err) {
    toast('No se pudo generar el PDF: ' + (err.message || 'error desconocido'));
  }
  btn.disabled = false; renderTable();
}

/* ===================== RESPALDO ===================== */
async function hacerBackup() {
  var b = $('backup'); b.disabled = true; b.textContent = 'Armando respaldo…';
  try {
    var rc = await sb.from('comentarios').select('*').order('creado_en');
    var rh = await sb.from('historial').select('*').order('creado_en');
    var porFila = {};
    (rc.data || []).forEach(function (c) { (porFila[c.acabado_id] = porFila[c.acabado_id] || []).push({ t: c.creado_en, quien: c.autor_nombre, dep: c.departamento || c.rol || '', txt: c.texto, sys: false }); });
    (rh.data || []).forEach(function (x) { (porFila[x.acabado_id] = porFila[x.acabado_id] || []).push({ t: x.creado_en, quien: x.autor_nombre || 'sin identificar', dep: '', txt: 'cambió ' + x.campo + ': ' + (x.antes || '—') + ' → ' + (x.despues || '—'), sys: true }); });

    var lista = S.items.slice().sort(function (a, b) {
      var ha = a.hoja === 'memoria' ? 0 : 1, hb = b.hoja === 'memoria' ? 0 : 1;
      return ha !== hb ? ha - hb : (a.orden || 0) - (b.orden || 0);
    });
    var hoy = new Date();
    var fechaTxt = hoy.toLocaleString('es-MX', { day: '2-digit', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    var filas = lista.map(function (r) {
      var u = imgUrl(r.img_ref || r.img_material || r.img_formato);
      var bit = (porFila[r.id] || []).sort(function (a, b) { return a.t < b.t ? -1 : 1; });
      return '<tr class="' + (r.estado === 'listo' ? 'listo' : '') + '">'
        + '<td>' + (r.estado === 'listo' ? '✓ Listo' : 'Borrador') + (r.hoja === 'despieces' ? '<br><i>Despiece</i>' : '') + '</td>'
        + '<td>' + (u ? '<img src="' + u + '">' : '') + '</td>'
        + '<td>' + esc(r.localizacion) + '</td>'
        + '<td>' + esc(r.material) + '<div class="s">' + esc([r.naturaleza, r.acabado].filter(Boolean).join(' · ')) + '</div></td>'
        + '<td class="p">' + esc(r.proveedor || '—') + '</td>'
        + '<td>' + esc(r.formato) + '</td>'
        + '<td>' + esc(r.origen) + '</td>'
        + '<td>' + esc(r.observaciones) + '</td>'
        + '<td class="b">' + (bit.length
            ? bit.map(function (e) { return '<div class="' + (e.sys ? 'sys' : '') + '"><b>' + esc(e.quien || '') + '</b> ' + esc(e.dep) + ' · ' + esc(fdatetime(e.t)) + '<br>' + esc(e.txt) + '</div>'; }).join('')
            : '<span class="s">—</span>') + '</td></tr>';
    }).join('');

    var doc = '<!doctype html><html lang="es"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width,initial-scale=1">'
      + '<title>Respaldo · Memoria de acabados · ' + esc(S.cfg.obra || '') + '</title><style>'
      + 'body{font-family:system-ui,sans-serif;background:#F5F1E6;color:#1C2A35;margin:0;padding:24px;font-size:13px}'
      + 'h1{font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 4px}'
      + '.cab{color:#6B7684;margin-bottom:4px}.aviso{color:#8A5A00;background:#F6E7C4;padding:8px 12px;border-radius:4px;margin:12px 0;display:inline-block}'
      + 'table{border-collapse:collapse;width:100%;background:#FFFDF7;margin-top:12px}'
      + 'th{background:#1D4E6E;color:#FFFDF7;text-align:left;padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}'
      + 'td{border-bottom:1px solid #E2DACA;padding:8px;vertical-align:top}'
      + 'tr.listo td{background:#DDEFE2}img{width:92px;height:92px;object-fit:cover;border-radius:4px}'
      + '.s{color:#6B7684;font-size:11px}.p{color:#1D4E6E;font-weight:600}'
      + '.b{font-size:11px;max-width:320px}.b>div{border-left:2px solid #1D4E6E;padding-left:7px;margin-bottom:6px}'
      + '.b>div.sys{border-left-color:#E2DACA;color:#6B7684}'
      + '</style></head><body>'
      + '<h1>Memoria de acabados</h1>'
      + '<div class="cab">' + esc(S.cfg.empresa) + ' · Obra ' + esc(S.cfg.obra) + ' · Clave ' + esc(S.cfg.clave) + ' · Cliente ' + esc(S.cfg.cliente) + '</div>'
      + '<div class="cab">' + lista.length + ' renglones · Respaldo tomado el ' + esc(fechaTxt) + ' por ' + esc(firma()) + '</div>'
      + '<div class="aviso">Copia congelada. No se conecta a la base ni se actualiza: refleja cómo estaba la memoria en esa fecha.</div>'
      + '<table><thead><tr><th>Estado</th><th>Imagen</th><th>Localización</th><th>Material y acabado</th>'
      + '<th>Proveedor / marca</th><th>Formato</th><th>Origen</th><th>Observaciones</th><th>Bitácora</th></tr></thead>'
      + '<tbody>' + filas + '</tbody></table></body></html>';

    var nombre = ('Respaldo memoria de acabados - ' + (S.cfg.obra || S.cfg.clave || '') + ' - '
      + hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0'))
      .replace(/[^\wáéíóúñÁÉÍÓÚÑ \-]/g, '').trim() + '.html';

    var url = URL.createObjectURL(new Blob([doc], { type: 'text/html;charset=utf-8' }));
    var a = document.createElement('a');
    a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 2000);
    toast('Respaldo descargado');
  } catch (err) {
    toast('No se pudo armar el respaldo: ' + (err.message || 'error desconocido'));
  }
  b.disabled = false; b.textContent = 'Hacer back up';
}

/* ===================== EVENTOS ===================== */
$('meta').addEventListener('change', async function (ev) {
  var k = ev.target.getAttribute && ev.target.getAttribute('data-c'); if (!k) return;
  S.cfg[k] = ev.target.value.trim();
  var r = await sb.from('proyecto').update({ empresa: S.cfg.empresa, obra: S.cfg.obra, clave: S.cfg.clave, cliente: S.cfg.cliente }).eq('id', 'actual');
  toast(r.error ? 'No se pudo guardar el encabezado' : 'Encabezado guardado');
  render();
});
$('chips').addEventListener('click', function (ev) { var f = ev.target.getAttribute('data-f'); if (f) { S.filtro = f; render(); } });
$('q').addEventListener('input', function (ev) { S.q = ev.target.value; renderTable(); });
$('add').addEventListener('click', function () { abrirCajon('new'); });
$('importar').addEventListener('click', abrirImportar);
$('backup').addEventListener('click', hacerBackup);
$('pdf').addEventListener('click', exportPdf);
$('tablewrap').addEventListener('change', function (ev) { if (ev.target && ev.target.id === 'prov') { S.prov = ev.target.value; render(); } });
$('tablewrap').addEventListener('click', function (ev) {
  var tg = ev.target.closest && ev.target.closest('[data-toggle]');
  if (tg) { ev.stopPropagation(); var it = S.items.filter(function (i) { return i.id === tg.getAttribute('data-toggle'); })[0]; if (it) alternarEstado(it); return; }
  var z = ev.target.getAttribute && ev.target.getAttribute('data-zoom');
  if (z) { ev.stopPropagation(); verZoom(z); return; }
  var tr = ev.target.closest && ev.target.closest('tr[data-id]');
  if (tr) abrirCajon(tr.getAttribute('data-id'));
});
$('tablewrap').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.matches && ev.target.matches('tr[data-id]')) abrirCajon(ev.target.getAttribute('data-id'));
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  var z = document.querySelector('.zoom'); if (z) { z.remove(); return; }
  if (document.querySelector('.modal')) { $('overlay').innerHTML = ''; return; }
  if (S.edit) cerrarCajon();
});

arranque();
})();
